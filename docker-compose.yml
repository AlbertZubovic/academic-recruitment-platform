version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    networks:
      - app-network

  admin-frontend:
    build:
      context: ./admin-site/admin-frontend
      dockerfile: Dockerfile
    volumes:
      - ./admin-site/admin-frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3001:3001"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app-network

  admin-backend:
    build:
      context: ./admin-site/admin-backend
      dockerfile: Dockerfile
    volumes:
      - ./admin-site/admin-backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "4000:4000"
    env_file:
      - ./admin-site/admin-backend/.env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 